else if(d.pre){const rb=TH.g.rb;TH.g={...PRE[d.pre]};if(rb!==undefined)TH.g.rb=rb;TH.o={};lg('Mudou o layout','Tema: '+d.pre);thSave(true);thD()}
else if(d.trs){const i=d.trs.indexOf('|'),sc=d.trs.slice(0,i),k=d.trs.slice(i+1),o=sc==='G'?TH.g:TH.o[sc];if(o){delete o[k];if(sc!=='G'&&!Object.keys(o).length)delete TH.o[sc]}thSave(sc==='sqc');thD()}
else if(d.th==='x')D4().close();
else if(d.th==='clearo'){TH.o={};lg('Mudou o layout','Removeu ajustes individuais');thSave(true);thD()}
else if(d.th==='rit'){delete TH.o[thItem];lg('Mudou o layout','Restaurou item: '+thItem);thSave(true);thD()}
else if(d.th==='reset')ask('Restaurar todas as cores e o layout ao padrão?',()=>{TH={g:{},o:{}};lg('Mudou o layout','Restaurou o padrão');thSave(true);thD()},'Sim, restaurar')});
$('#bthm').onclick=()=>{if(!can('A'))return;D4().show();thD()};
thApply();


/* ===== Supabase: tempo real, fila offline, login e usuários ===== */
const SBJS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',DOM='@painel.interno';
let SBU=null,live=0,manualOut=0,fp=1,rtm,flushing=0;
function sbCfg(){return SB_URL&&SB_KEY?{url:SB_URL,key:SB_KEY}:LS.g('tl_sb')}
const ldS=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
function stTxt(){if(!sbCfg())return['Somente neste aparelho','lo'];if(!navigator.onLine)return[OB.length?'Offline · '+OB.length+' alteração(ões) a enviar':'Offline','of'];if(!DB)return['Conectando…','pe'];if(OB.length)return['Enviando…','pe'];if(!live)return['Reconectando…','pe'];return['Sincronizado','ok']}
function setSt(){const e=$('#sy');if(!e)return;const [t,c]=stTxt();e.textContent=t;e.className='sy '+c;const e2=$('#sy2');if(e2)e2.textContent=t}
/* fila de envio (guardada no aparelho; sobe quando houver rede e login) */
const obSave=()=>LS.s('tl_ob',OB);
function ob(op){if(op.k==='up'||op.k==='del')OB=OB.filter(o=>!((o.k==='up'||o.k==='del')&&o.id===op.id));else if(op.k==='cfg')OB=OB.filter(o=>!(o.k==='cfg'&&o.chave===op.chave));
OB.push(op);obSave();setSt();clearTimeout(ob.h);ob.h=setTimeout(flush,50)}
function cloudPush(){if(!sbCfg()||!can('O'))return;const cur=new Map(mv.map(m=>[m.id,m]));
cur.forEach((m,id)=>{const j=JSON.stringify(m);if(SYNC.get(id)!==j){SYNC.set(id,j);ob({k:'up',id,d:JSON.parse(j)})}});
[...SYNC.keys()].forEach(id=>{if(!cur.has(id)){SYNC.delete(id);ob({k:'del',id})}})}
function cfgPush(){if(!sbCfg()||!can('A'))return;clearTimeout(cfgPush.h);cfgPush.h=setTimeout(()=>{ob({k:'cfg',chave:'tema',valor:TH});ob({k:'cfg',chave:'nome',valor:{v:srcName}})},400)}
async function flush(){if(flushing||!DB||!OB.length||!navigator.onLine)return;flushing=1;setSt();
try{const {data:{session}}=await DB.auth.getSession();if(!session)return;
while(OB.length){const o=OB[0];let n=1,r;
if(o.k==='up'){const g=[];for(const x of OB){if(x.k!=='up'||g.length>=200)break;g.push(x)}n=g.length;r=await DB.from('movimentos').upsert(g.map(x=>({id:x.id,d:x.d,atualizado:new Date().toISOString()})))}
else if(o.k==='del'){const g=[];for(const x of OB){if(x.k!=='del'||g.length>=200)break;g.push(x.id)}n=g.length;r=await DB.from('movimentos').delete().in('id',g)}
else if(o.k==='cfg')r=await DB.from('config').upsert({chave:o.chave,valor:o.valor});
else r=await DB.from('historico').insert({t:o.e.t,w:o.e.w,a:o.e.a,d:o.e.d});
if(r.error){const st=r.status||0;if(st===401){await DB.auth.refreshSession().catch(()=>{});break}
if(st>=400&&st<500&&st!==408&&st!==429){toast('Uma alteração foi recusada pelo servidor: '+(r.error.message||st));OB.splice(0,n);continue}break}
OB.splice(0,n);obSave()}}
catch(e){}finally{flushing=0;obSave();setSt()}}
/* leitura */
function applyCfg(r){if(OB.some(o=>o.k==='cfg'&&o.chave===r.chave))return;
if(r.chave==='tema'&&r.valor&&JSON.stringify(r.valor)!==JSON.stringify(TH)){TH=r.valor;TH.g=TH.g||{};TH.o=TH.o||{};LS.s('tl_theme',TH);thApply();if(D4().open)thD()}
if(r.chave==='nome'&&r.valor&&r.valor.v&&r.valor.v!==srcName){srcName=r.valor.v;LS.s('tl_src',srcName);$('#src').textContent=srcName}}
async function pull(){if(!DB||!navigator.onLine)return;
try{let rows=[],from=0;for(;;){const r=await DB.from('movimentos').select('id,d').order('id').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}
let arr=rows.map(r=>r.d);OB.forEach(o=>{if(o.k==='up'){const i=arr.findIndex(m=>m.id===o.id);if(i>=0)arr[i]=o.d;else arr.push(o.d)}else if(o.k==='del')arr=arr.filter(m=>m.id!==o.id)});
mv=arr;SYNC=new Map(mv.map(m=>[m.id,JSON.stringify(m)]));LS.s('tl_mv',mv);
const c=await DB.from('config').select('chave,valor');if(!c.error)c.data.forEach(applyCfg);
const f1=fp;fp=0;load(!f1)}catch(e){}}
function onMv(p){const id=(p.new&&p.new.id)||(p.old&&p.old.id);if(!id||OB.some(o=>o.id===id))return;
if(p.eventType==='DELETE'){mv=mv.filter(m=>m.id!==id);SYNC.delete(id)}else{const d=p.new.d,i=mv.findIndex(m=>m.id===id);if(i>=0)mv[i]=d;else mv.push(d);SYNC.set(id,JSON.stringify(d))}
LS.s('tl_mv',mv);clearTimeout(rtm);rtm=setTimeout(()=>load(1),80)}
function onCfg(p){if(p.new&&p.new.chave){applyCfg(p.new);render()}}
async function sbInit(){const c=sbCfg();if(!c||DB||sbInit.b)return;sbInit.b=1;
try{if(!window.supabase)await ldS(SBJS);
DB=supabase.createClient(c.url,c.key,{auth:{storageKey:'tl_sb_auth',persistSession:true,autoRefreshToken:true}});
DB.auth.onAuthStateChange((ev,se)=>{if(ev==='SIGNED_OUT'&&!manualOut&&LS.g('tl_prof')){role='U';who='';SBU=null;LS.s('tl_prof',null);applyRole();toast('Sessão encerrada. Entre novamente.')}if(se&&(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'))setTimeout(flush,0)});
DB.channel('painel').on('postgres_changes',{event:'*',schema:'public',table:'movimentos'},onMv).on('postgres_changes',{event:'*',schema:'public',table:'config'},onCfg).subscribe(st=>{live=st==='SUBSCRIBED';setSt();if(live){pull();flush()}});
setSt();pull();flush()}
catch(e){sbInit.b=0;DB=null;setSt()}}
addEventListener('online',()=>{setSt();if(!DB)sbInit();else{flush();pull()}});addEventListener('offline',setSt);
/* login */
const saveProf=()=>LS.s('tl_prof',{role,max:SBU.max,nome:who});
function sbLogout(){if(!sbCfg())return;manualOut=1;LS.s('tl_prof',null);SBU=null;if(DB)DB.auth.signOut({scope:'local'}).catch(()=>{}).finally(()=>{manualOut=0});else manualOut=0}
async function sbLogin(r){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value.trim();if(!u||!p){msg('Informe usuário e senha.');return}
if(!DB||!navigator.onLine){msg('Sem conexão com o servidor. Entre com internet (depois o acesso fica salvo no aparelho).');return}
msg('Entrando…');
const a=await DB.auth.signInWithPassword({email:u+DOM,password:p});if(a.error){const em=String(a.error.message||''),st=a.error.status;msg(/invalid login|credentials/i.test(em)?'Usuário ou senha incorretos.':'Falha ao conectar ('+(st||'')+' '+em.slice(0,80)+'). Verifique a internet.');return}
const q=await DB.from('profiles').select('nome,role,ativo').eq('id',a.data.user.id).single(),pr=q.data,pk=pr&&{administrador:'A',operador:'O'}[pr.role];
if(q.error||!pr||!pr.ativo||!pk){await DB.auth.signOut({scope:'local'});msg('Este usuário não tem acesso ao painel.');return}
if(RK[pk]<RK[r]){await DB.auth.signOut({scope:'local'});msg('Seu perfil é '+RN[pk]+': não permite entrar como '+RN[r]+'.');return}
role=r;who=(pr.nome||u).toUpperCase();SBU={max:pk,nome:who};saveProf();applyRole();D2().close();flush();pull()}
/* usuários (somente administrador) */
async function admCall(b){const r=await DB.functions.invoke('admin-users',{body:b});if(r.error){let m=r.error.message;try{const j=await r.error.context.json();m=j.error||m}catch(e){}throw new Error(m)}return r.data}
async function usrList(){const el=$('#ul');if(!el)return;if(!DB||!navigator.onLine){el.textContent='É preciso estar online para gerenciar usuários.';return}
try{const {users}=await admCall({action:'list'});el.innerHTML=users.length?users.map(u=>`<div class="uit" data-id="${esc(u.id)}"><div><b>${esc(u.nome)}</b> · ${esc(u.login)}</div><div class="row2"><select data-f="role"><option value="operador"${u.role==='operador'?' selected':''}>Operador</option><option value="administrador"${u.role==='administrador'?' selected':''}>Administrador</option></select><label class="chk"><input type="checkbox" data-f="ativo"${u.ativo?' checked':''}> Ativo</label><button class="btn mini" data-ua="upd">Salvar perfil</button></div><div class="row2"><input type="password" data-pw data-f="pw" placeholder="Nova senha" autocomplete="new-password"><button class="btn mini" data-ua="pw">Trocar senha</button><button class="btn mini" data-ua="del">Remover</button></div></div>`).join(''):'Nenhum usuário cadastrado.'}catch(e){el.textContent='Erro: '+e.message}}
function usrD(){D2().innerHTML=`<div class="dh"><h2>Usuários e perfis</h2><button class="btn" data-x>Fechar</button></div><div class="db"><div id="ul">Carregando…</div><h3>Novo usuário</h3><div class="fm"><label>Nome<input id="un" autocomplete="off"></label><label>Usuário (login)<input id="ulg" autocomplete="off" autocapitalize="none" placeholder="ex.: joao.silva"></label><label>Senha (mín. 6)<input id="up" type="password" data-pw autocomplete="new-password"></label><label>Perfil<select id="ur"><option value="operador">Operador</option><option value="administrador">Administrador</option></select></label></div>${pw()}<button class="btn p" data-ua="add">Criar usuário</button><div id="msg" class="wr"></div></div>`;op();usrList()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-ua]');if(!t||!can('A'))return;const a=t.dataset.ua,row=t.closest('.uit'),id=row&&row.dataset.id,q=f=>row.querySelector('[data-f='+f+']');
try{if(a==='add'){const b={action:'create',nome:$('#un').value.trim(),login:$('#ulg').value.trim().toLowerCase(),senha:$('#up').value,role:$('#ur').value};await admCall(b);msg('Usuário criado.');['un','ulg','up'].forEach(k=>$('#'+k).value='');lg('Criou usuário',b.login+' ('+b.role+')');usrList()}
else if(a==='upd'){const b={action:'update',id,role:q('role').value,ativo:q('ativo').checked};await admCall(b);msg('Perfil atualizado.');lg('Alterou usuário',row.querySelector('b').textContent+' → '+b.role+(b.ativo?'':' (inativo)'));usrList()}
else if(a==='pw'){const p=q('pw').value;if(p.length<6){msg('A senha precisa ter ao menos 6 caracteres.');return}await admCall({action:'password',id,senha:p});q('pw').value='';msg('Senha alterada.');lg('Trocou senha de',row.querySelector('b').textContent)}
else if(a==='del')ask('Remover este usuário?',async()=>{try{await admCall({action:'delete',id});lg('Removeu usuário',row.querySelector('b').textContent);usrList()}catch(x){msg(x.message)}},'Sim, remover')}catch(x){msg(x.message)}});
document.addEventListener('change',e=>{if(e.target.id==='shp')document.querySelectorAll('#d2 [data-pw]').forEach(i=>i.type=e.target.checked?'text':'password')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^(lu|lp|nm|pin)$/.test(e.target.id)){const b=$('#d2 [data-ok]');if(b)b.click()}});
/* OF GENERAL */
document.addEventListener('change',e=>{const t=e.target,id=t.dataset&&t.dataset.ofg;if(!id||!can('O'))return;const m=mv.find(x=>x.id===id);if(!m)return;m.ofg=t.checked;lg('OF GENERAL',(t.checked?'Marcou ':'Desmarcou ')+dm(m));saveM();load(1)});
const blk=()=>{const n=Date.now();document.querySelectorAll('[data-ofg]').forEach(el=>el.classList.toggle('blk',+el.dataset.ofg>n))};
/* sincronização: painel do administrador */
function synD(){const st=stTxt();D2().innerHTML=`<div class="dh"><h2>Sincronização</h2><button class="btn" data-x>Fechar</button></div><div class="db"><div>Estado: <b id="sy2">${esc(st[0])}</b></div><div>Alterações aguardando envio: <b>${OB.length}</b></div>${sbCfg()?'':`<div class="wr">Servidor não configurado. Preencha SB_URL e SB_KEY no início do arquivo ou informe abaixo.</div><div class="fm"><label>URL do projeto<input id="sy_u"></label><label>Chave anon<input id="sy_k"></label></div><button class="btn p" data-sy="save">Salvar e conectar</button>`}<div class="row2"><button class="btn" data-sy="now">Sincronizar agora</button></div><div id="msg" class="wr"></div></div>`;op()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-sy]');if(!t||!can('A'))return;if(t.dataset.sy==='now'){msg('Sincronizando…');flush().then(pull).then(()=>msg('Pronto.'))}
else{const u=$('#sy_u').value.trim(),k=$('#sy_k').value.trim();if(!/^https:\/\/.+/.test(u)||!k){msg('Informe a URL (https://…) e a chave.');return}LS.s('tl_sb',{url:u,key:k});location.reload()}});
$('#bsyn').onclick=()=>{if(can('A'))synD()};$('#busr').onclick=()=>{if(can('A')&&sbCfg())usrD()};
/* sessão salva no aparelho (não sai ao recarregar) */
(function(){if(sbCfg()){const pr=LS.g('tl_prof');if(pr&&RK[pr.role]!==undefined&&RK[pr.max]!==undefined){role=pr.role;who=pr.nome;SBU={max:pr.max,nome:pr.nome}}}
else{const se=LS.g('tl_sess');if(se&&auth[se.r]&&auth[se.r]===se.h){role=se.r;who=se.w}}applyRole()})();
if(sbCfg())SYNC=new Map(mv.map(m=>[m.id,JSON.stringify(m)]));
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setSt();sbInit();setInterval(()=>{if(OB.length)flush()},20000);setInterval(blk,3000);

load();
</script>
</body></html>

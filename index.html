<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16314c">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Voos BABR"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Movimentos de Voos BABR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#16314c;--bg2:#1c3b59;--sf:#244a6d;--bd:#3d688f;--tx:#eef5fb;--mu:#a8c0d6;--am:#ffc83d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(160deg,#15304b,#1d3f5f 60%,#1a384f);color:var(--tx);font:15px/1.4 Barlow,"Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px 8px}
h1{margin:0;font:700 36px/1 "Barlow Condensed","Arial Narrow",sans-serif;flex:1 1 220px}
h1 small{display:block;font:500 13px Barlow,system-ui,sans-serif;color:var(--mu);margin-top:5px}
.clk{display:flex;gap:8px}.clk div{background:#0d1d2e;border-radius:8px;padding:4px 10px 7px}
.clk small{display:block;font:600 11px Barlow,system-ui,sans-serif;color:var(--mu);margin-bottom:2px}.clk .fls{font-size:22px}
.btn,.chip,.seg button{border:1px solid var(--bd);background:rgba(255,255,255,.07);color:var(--tx);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;font:600 14px Barlow,system-ui,sans-serif;white-space:nowrap}
.btn.p{background:var(--am);border-color:var(--am);color:#1a1300}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.cd:focus-visible,.br:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.bar{display:flex;gap:8px;padding:4px 16px;overflow-x:auto;align-items:center;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip.on{background:var(--c,var(--am));border-color:var(--c,var(--am));color:#06121f}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}
.chip.on i{background:#06121f}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:10px 0 0 10px;margin:0}.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.on{background:var(--am);border-color:var(--am);color:#1a1300}
input,select{border:1px solid var(--bd);background:#0f2539;color:var(--tx);border-radius:10px;padding:8px 12px;min-height:42px;font:500 14px Barlow,system-ui,sans-serif}
input[type=search]{min-width:170px;flex:1}
.info{padding:6px 16px;color:var(--mu);font-size:13px}
.fls{display:inline-flex;gap:2px;vertical-align:middle}
.fl{display:inline-block;min-width:.7em;text-align:center;padding:0 4px;background:linear-gradient(#1a2e43 50%,#0b1723 50%);color:var(--am);border-radius:3px;font:700 1em/1.2 "Barlow Condensed","Arial Narrow",sans-serif;position:relative;animation:fp .45s ease-out both;animation-delay:calc(var(--k)*30ms)}
.fl:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.75)}
.co{color:var(--am);font-weight:700;padding:0 1px}
@keyframes fp{from{transform:rotateX(-90deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
.board{margin:6px 16px;background:#0d1d2e;border:1px solid var(--bd);border-radius:12px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bh{display:flex;align-items:center;gap:8px}.bh .hint{color:var(--mu);font-size:12px;flex:1;min-width:0}.board .seg button{min-height:34px;padding:4px 12px;font-size:13px}
.seg .ic{width:30px;height:12px;vertical-align:-1px;margin-right:6px;--wc:#0d1d2e}
.br{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:#14293f;border:0;border-left:5px solid var(--c);border-radius:8px;padding:4px 10px;margin-top:4px;color:var(--tx);cursor:pointer;font:inherit}
.br .fls{font-size:20px}.bi{min-width:0}.bi b{font-size:14px}.bi small{font-size:12px}
.bi b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bi small{color:var(--mu)}
.bs{color:var(--am);font-weight:600;font-size:12px;text-align:right}
@media (max-width:640px){.br{grid-template-columns:auto 1fr auto}.br .dst{justify-self:start}.bs{grid-column:3;grid-row:1}.bi{grid-column:1/-1;grid-row:2}.bh .hint{display:none}h1{font-size:30px}}
.tl{height:calc(max(470px,58vh)*var(--z,1));overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;background:rgba(10,24,38,.28);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.rail{display:flex;align-items:stretch;height:max(470px,58vh);zoom:var(--z,1);width:max-content;padding:0 30px;background:repeating-linear-gradient(90deg,#cfe0ee 0 18px,transparent 18px 38px) 0 50%/100% 2px no-repeat,linear-gradient(#0e2133,#0e2133) 0 50%/100% 12px no-repeat}
.nd{position:relative;width:196px;flex:none}
.mk{position:absolute;left:50%;top:50%;width:96px;height:56px;margin:-28px 0 0 -48px;border-radius:14px;background:var(--c);border:3px solid #16314c;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.45);color:#fff}
.mk svg{display:block;width:100%;height:100%}
.st{position:absolute;left:50%;width:4px;margin-left:-2px;height:36px;background:var(--c)}
.up .st{bottom:50%}.dn .st{top:50%}
.cd{position:absolute;left:4px;right:4px;background:var(--sf);border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:6px 6px 14px 14px;padding:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.38);cursor:pointer;text-align:left;color:inherit;font:inherit}
.up .cd{bottom:calc(50% + 34px)}.dn .cd{top:calc(50% + 34px)}
.nd.now .cd{box-shadow:0 0 0 3px var(--am),0 6px 16px rgba(0,0,0,.38)}
.ch{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1d2e;border-bottom:2px dashed var(--bd)}
.ch .fls{font-size:28px}
.ot{color:var(--mu);font:600 12px Barlow,system-ui,sans-serif}
.nx{margin-left:auto;background:var(--am);color:#1a1300;font:700 11px Barlow,system-ui,sans-serif;padding:2px 6px;border-radius:5px}
.cb{padding:7px 10px 9px}
.ty{font:700 13px "Barlow Condensed","Arial Narrow",sans-serif;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.rt{font:700 27px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}.rt u{text-decoration:none;color:var(--c);padding:0 3px}
.ms{font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.tg{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--c);color:#06121f;margin:3px 4px 0 0}
.tg.g{background:rgba(255,255,255,.15);color:var(--tx)}
.dd{width:92px;flex:none;position:relative}
.dd:before{content:"";position:absolute;left:50%;top:5%;bottom:5%;border-left:2px dashed var(--bd)}
.dd span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--am);color:#1a1300;font:700 17px "Barlow Condensed","Arial Narrow",sans-serif;padding:4px 10px;border-radius:8px;white-space:nowrap;z-index:3}
.empty{margin:auto;padding:30px;text-align:center;color:var(--mu);max-width:340px}
dialog{border:0;border-radius:16px;padding:0;width:calc(100% - 24px);max-width:560px;max-height:88%;background:var(--sf);color:var(--tx);box-shadow:0 10px 40px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,12,20,.65)}
.dh{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.dh h2{margin:0;font:700 24px "Barlow Condensed","Arial Narrow",sans-serif;flex:1}
.db{padding:12px 16px 16px;display:grid;gap:10px}
.db h3{margin:0;font-size:13px;color:var(--mu);font-weight:600}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--bd);border-radius:8px;padding:3px 9px;font-weight:600}
.pill.hl{background:var(--c);border-color:var(--c);color:#06121f}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:14px}
.it .h{font-weight:700;color:var(--c)}
textarea{width:100%;border:1px solid var(--bd);background:#0f2539;color:var(--tx);border-radius:10px;padding:8px;font:12px monospace}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fm label{display:grid;gap:3px;font-size:13px;color:var(--mu)}.fm input,.fm select{width:100%}
.pv{overflow:auto;max-height:190px;border:1px solid var(--bd);border-radius:8px}.pv table{border-collapse:collapse;font-size:12px}.pv td{border:1px solid var(--bd);padding:2px 6px;white-space:nowrap}
dialog{overflow:auto}.wr{color:var(--am);min-height:1.2em}
@media (max-width:520px){.fm{grid-template-columns:1fr}}
.zmb{display:flex;align-items:center;gap:10px;padding:0 16px;flex-wrap:wrap}.zmb .info{flex:1 1 220px;padding:6px 0}
.zm{display:flex;align-items:center;gap:6px}.zm button{width:46px;height:46px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.07);color:var(--tx);font:700 24px/1 Barlow,sans-serif;cursor:pointer}.zm span{min-width:48px;text-align:center;font-weight:600}
.lgi{border-left:4px solid var(--am);padding:5px 10px;background:rgba(255,255,255,.06);border-radius:6px;font-size:14px}.lgi .ac{color:var(--am);font-weight:700}
@media (max-width:700px){#bnew:not([hidden]){position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;min-height:54px;padding:0 20px;border-radius:999px;background:var(--am);border-color:var(--am);color:#1a1300;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.5)}}
.bt{margin-left:auto;border:1px solid var(--bd);background:rgba(255,255,255,.07);color:var(--tx);border-radius:10px;padding:4px 12px;min-height:34px;cursor:pointer;font:600 13px Barlow,system-ui,sans-serif;white-space:nowrap}
.board.min{padding:4px 8px}.board.min .bt{margin:0;width:100%;text-align:left;min-height:38px;color:var(--mu)}
.bt:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--am);color:#1a1300;font:600 14px Barlow,system-ui,sans-serif;padding:10px 16px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><g id="jet" fill="currentColor"><path d="M4 12C4 10 8 9 14 9H46C54 9 60 11 62 12.5C60 14 54 15.5 46 15.5H14C8 15.5 4 14 4 12Z"/><path d="M6 10.5 3 2H9L17 9.5Z"/><path d="M25 14H41L31 22.5H24Z" opacity=".85"/><ellipse cx="33" cy="19" rx="4" ry="1.7"/><path d="M17 11.8H45" style="stroke:var(--wc,var(--c));stroke-width:1.6;stroke-dasharray:2 2.2;fill:none"/></g></defs></svg>
<header>
<h1>Movimentos de voos - BABR<small id="src">Dados de exemplo</small></h1>
<div class="clk"><div><small>Brasília</small><span id="cl"></span></div><div><small>Zulu (Z)</small><span id="cz"></span></div></div>
<button class="btn" id="bnew" hidden>+ Novo voo</button><label class="btn p" for="file" id="lfile" tabindex="0" hidden>Importar planilha</label>
<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
<button class="btn" id="now">Próximo voo</button><button class="btn" id="brole">Acesso: Usuário ▾</button><button class="btn" id="bhist" hidden>Histórico</button>
</header>
<div class="bar" id="sqs" aria-label="Esquadrão"></div>
<div class="bar">
<div class="seg" id="tys"><button data-ty="ALL" class="on">Tudo</button><button data-ty="DEP">Decolagens</button><button data-ty="ARR">Pousos</button></div>
<div class="seg" id="zs"><button data-z="0" class="on">Hora local</button><button data-z="1">Hora Z</button></div>
<select id="day" aria-label="Dia"></select>
<input id="mo" type="month" aria-label="Mês dos voos" hidden>
<input id="q" type="search" placeholder="Buscar aeronave, local ou missão">
</div>
<section class="board" id="board"></section>
<div class="zmb"><div class="info" id="info"></div><div class="zm" aria-label="Zoom da linha do tempo"><button data-zm="-" aria-label="Diminuir zoom">−</button><span id="zv">100%</span><button data-zm="+" aria-label="Aumentar zoom">+</button></div></div>
<main class="tl" id="tl"><div class="rail" id="rail"></div></main>
<dialog id="dlg"></dialog><dialog id="d2"></dialog><dialog id="d3"></dialog><div id="ts" class="ts" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const PAL=['#4cc3ff','#3ddc97','#ff8a5b','#d4e157','#ff6b8a','#2dd4bf'];
const LEG=/^([A-Z0-9]{2,5})\s+(\d{1,2})$/,ETA=/^(?:([A-Z0-9]{2,5})\s+)?(\d{1,2})(?:\.0+)?$/;
const WD=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],OFF=-10800000;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nsq=s=>{s=String(s).toUpperCase().trim();let a;if(/6\s*[°ºO]?\s*ETA/.test(s))return'6 ETA';if(/EXTERN/.test(s))return'EXTERNAS';if(/ESTRANG/.test(s))return'ESTRANGEIRAS';if(a=/^GTE\s*-?\s*(\d)/.exec(s))return'GTE '+a[1];return s},norm=nsq;
const pt=v=>{if(typeof v==='number'&&v<1)return Math.round(v*1440)%1440;const m=/(\d{1,2})\s*[:hH.]?\s*(\d{2})/.exec(String(v));return m&&+m[1]<24?+m[1]*60+ +m[2]:null};


function parse(rows,y,mo){
const out=[];let sq='',fid=0;
rows.forEach((r,i)=>{
r=(r||[]).map(x=>x==null?'':x);const s=k=>String(r[k]).trim().toUpperCase();
const lc=[3,4,5,6,7,8].map(k=>LEG.exec(s(k)));
if(!lc.some(Boolean)){if(String(r[0]).trim()&&!String(r[1]).trim()&&!String(r[2]).trim())sq=norm(String(r[0]));return}
const ac=String(r[0]).trim();if(!ac)return;
const nx=rows[i+1]||[];let orgao='',paxr=null;
[2,3].forEach(o=>{const q=rows[i+o]||[];if(/PAX/i.test(q[2]||''))paxr=q;if(/RG[ÃA]O/i.test(q[2]||''))orgao=String(q[3]||'').trim()});
const legs=[];lc.forEach((m,k)=>{if(m)legs.push({c:m[1],d:+m[2],t:pt(nx[3+k]),x:paxr?String(paxr[3+k]||'').trim():''})});
const route=s(2).split(/\s*-\s*/).filter(Boolean);
let k0=-1;for(let a=0;a+legs.length<=route.length&&k0<0;a++)if(legs.every((l,j)=>route[a+j]===l.c))k0=a;
const em=ETA.exec(s(9)),eLoc=(em&&em[1])||'BR',eT=pt(nx[9]);
let m=mo,prev=0;
const U=(d,t,c)=>{let mm=m;if(d<prev){mm=m+1;if(c)m=mm}if(c)prev=d;return Date.UTC(y,mm,d,0,t)};
const base={ac,sq,fid:++fid,emb:String(r[1]).trim(),mission:String(r[10]).trim(),des:String(r[12]).trim(),orgao,route};
const evs=[];
legs.forEach((l,j)=>{if(l.t==null)return;evs.push({...base,ty:'DEP',from:l.c,to:(k0>=0&&route[k0+j+1])||(legs[j+1]&&legs[j+1].c)||eLoc,utc:U(l.d,l.t,true),pax:l.x})});
if(em&&eT!=null){const u=U(+em[2],eT,false),pv=evs.filter(e=>e.utc<=u).pop();evs.push({...base,ty:'ARR',from:pv?pv.from:'',to:eLoc,utc:u,pax:''})}
evs.sort((a,b)=>a.utc-b.utc);evs.forEach(e=>e.fl=evs);out.push(...evs)});
return out.sort((a,b)=>a.utc-b.utc||(a.ty==='ARR'?-1:1))}

let HID=false,rows=[],ev=[],sqs=[],srcName='Dados de exemplo',f={bt:'DEP',sq:'ALL',ty:'ALL',day:'ALL',q:'',z:false};
const now0=new Date();$('#mo').value=now0.getFullYear()+'-'+p2(now0.getMonth()+1);
try{const sv=JSON.parse(localStorage.getItem('tl_rows')||'null');if(sv&&sv.rows){rows=sv.rows;srcName=sv.name||'Planilha carregada'}}catch(e){}
const col=sq=>PAL[Math.max(0,sqs.indexOf(sq))%PAL.length];
const sh=()=>f.z?0:OFF;
const dt=u=>new Date(u+sh()),hm=u=>{const d=dt(u);return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const hm2=u=>{const d=new Date(u+(f.z?OFF:0));return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const dk=u=>{const d=dt(u);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const dl=u=>{const d=dt(u);return WD[d.getUTCDay()]+' '+p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)};

function load(){const [y,m]=$('#mo').value.split('-').map(Number);ev=hyd(mv).sort((a,b)=>a.utc-b.utc||(a.ty==='ARR'?-1:1));sqs=[...SQ,...new Set(ev.map(e=>e.sq).filter(x=>!SQ.includes(x)))];$('#src').textContent=srcName;if(f.sq!=='ALL'&&f.sq!=='GTE'&&!sqs.includes(f.sq))f.sq='ALL';render(true)}

const fl=t=>[...String(t)].map((c,k)=>c===':'?'<i class="co">:</i>':`<span class="fl" style="--k:${k}">${esc(c)}</span>`).join('');
const J=t=>`<use href="#jet" transform="${t}"/>`;
const GR='<path d="M5 49H91" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 5"/>';
const scene=ty=>ty==='DEP'?`<svg viewBox="0 0 96 56">${GR}<path d="M8 46C34 44 52 34 70 14" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="2 4" fill="none"/>${J('translate(40 6) rotate(-26 20 7) scale(.62)')}</svg>`:`<svg viewBox="0 0 96 56">${GR}<path d="M6 8C34 12 56 26 74 44" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="2 4" fill="none"/>${J('translate(32 16) rotate(22 20 7) scale(.62)')}</svg>`;
const sqm=e=>f.sq==='ALL'||e.sq===f.sq||(f.sq==='GTE'&&e.sq.startsWith('GTE'));
const hmx=u=>{const d=new Date(u);return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
function tick(){const n=Date.now();$('#cl').innerHTML=fl(hmx(n+OFF));$('#cz').innerHTML=fl(hmx(n))}
function board(){
const bd=$('#board');bd.classList.toggle('min',HID);if(HID){bd.innerHTML='<button class="bt" data-bd="0">Mostrar quadro de partidas e chegadas ▾</button>';return}
const q=f.q.toLowerCase(),t=f.bt,n=Date.now(),ic='<svg class="ic" viewBox="0 0 64 24" style="color:currentColor"><use href="#jet" transform="rotate(-24 32 12)"/></svg>';
const l=ev.filter(e=>e.ty===t&&sqm(e)&&(!q||[e.ac,e.sq,e.from,e.to,e.mission,e.des].join(' ').toLowerCase().includes(q)));
let u=l.filter(e=>e.utc>=n-1800000);if(!u.length)u=l.slice(-4);u=u.slice(0,4);
const st=e=>{const m=Math.round((e.utc-n)/60000);return m<0?'Já ocorreu':m<60?'em '+m+' min':m<1440?'em '+Math.floor(m/60)+' h '+p2(m%60)+' min':'em '+Math.floor(m/1440)+' d'};
$('#board').innerHTML=`<div class="bh"><div class="seg"><button data-bt="DEP" class="${t==='DEP'?'on':''}">${ic}Partidas</button><button data-bt="ARR" class="${t==='ARR'?'on':''}">${ic.replace('-24','24')}Chegadas</button></div><span class="hint">Próximos 4 movimentos · toque para ver o roteiro</span><button class="bt" data-bd="1">Ocultar quadro ▴</button></div>`+

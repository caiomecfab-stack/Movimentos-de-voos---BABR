const svT=()=>{LS.s('tl_th',TH);if(DB&&can('A')){clearTimeout(svT.h);svT.h=setTimeout(()=>DB.ref('theme').set(TH&&Object.keys(TH).length?clean(TH):null).catch(()=>setLive('Erro ao salvar','x')),350)}};
function applyTheme(){const R=document.documentElement.style;
COL.forEach(k=>R.setProperty('--'+k,ALPHA[k]!=null?hx(gv(k),ALPHA[k]):gv(k)));
['h1','cw','cr','brd','rh'].forEach(k=>R.setProperty('--'+k,gv(k)+'px'));
VIS.forEach(k=>document.body.classList.toggle('h-'+k,TH['v_'+k]===false));
$('#ttl').textContent=gv('ttl');
const l=document.querySelector('.rwy .dg.l'),r=document.querySelector('.rwy .dg.r');if(l)l.textContent=gv('rwl');if(r)r.textContent=gv('rwr');
const b=$('#board');if(gv('bpos')==='bottom')$('#tl').after(b);else $('.zmb').before(b)}
let PS='all';
const ctl=([k,l,ty,a,b])=>{const v=gv(k);
if(ty==='c')return `<label class="tr"><span>${l}</span><input type="color" data-k="${k}" value="${v}"></label>`;
if(ty==='r')return `<label class="tr"><span>${l}: <b>${v}</b></span><input type="range" data-k="${k}" min="${a}" max="${b}" value="${v}"></label>`;
if(ty==='t')return `<label class="tr"><span>${l}</span><input type="text" data-k="${k}" value="${esc(v)}"></label>`;
if(ty==='v')return `<label class="tr ck"><input type="checkbox" data-k="${k}"${TH[k]!==false?' checked':''}><span>${l}</span></label>`;
return `<label class="tr"><span>${l}</span><select data-k="${k}">${a.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${ov}"${String(v)===String(ov)?' selected':''}>${esc(ol)}</option>`}).join('')}</select></label>`};
const sqc=()=>sqs.map(n=>`<label class="tr"><span>${esc(n)}</span><input type="color" data-sq="${esc(n)}" value="${col(n)}"></label>`).join('')+ctl(['v_sqs','Mostrar os botões de esquadrão','v']);
function panel(){const T=$('#tp'),old=T.querySelector('.tb'),y=old?old.scrollTop:0,it=PS==='all'?ITEMS:ITEMS.filter(i=>i.id===PS);
T.innerHTML=`<div class="th"><b>Personalizar painel</b><div class="pr"><button class="pb" data-tp="min">Ver painel</button><button class="pb" data-tp="close">Fechar</button></div></div><div class="tb">
<div class="nt">${CLOUD?'Tudo o que você muda aqui aparece na hora para todos os usuários.':'Sem banco online configurado: as mudanças valem só neste aparelho.'}</div>
<label class="tr"><span>O que editar</span><select id="ps"><option value="all">Todos os itens</option>${ITEMS.map(i=>`<option value="${i.id}"${PS===i.id?' selected':''}>${i.t}</option>`).join('')}</select></label>
<div class="tr"><span>Aplicar um tema a todos os itens de uma vez</span><div class="pr">${Object.keys(PRE).map(n=>`<button class="pb" data-pre="${n}">${n}</button>`).join('')}</div></div>
${it.map(i=>`<section class="sec"><h4>${i.t}</h4>${i.c==='sq'?sqc():i.c.map(ctl).join('')}<div><button class="pb" data-rst="${i.id}">Restaurar este item</button></div></section>`).join('')}
<div><button class="pb" data-rstall>Restaurar tudo ao padrão</button></div></div>`;
const nb=T.querySelector('.tb');if(nb)nb.scrollTop=y}
const everything=()=>{svT();applyTheme();render();panel()};
$('#tp').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;
if(t.dataset.sq!==undefined){TH.sq=TH.sq||{};TH.sq[t.dataset.sq]=t.value;svT();render();return}
if(!k)return;
if(k.startsWith('v_')){if(t.checked)delete TH[k];else TH[k]=false}
else if(t.type==='range'||k==='nrows')TH[k]=+t.value;else TH[k]=t.value;
if(t.type==='range'){const b=t.parentElement.querySelector('b');if(b)b.textContent=t.value}
svT();applyTheme();if(k==='nrows')board()});
$('#tp').addEventListener('change',e=>{if(e.target.id==='ps'){PS=e.target.value;panel()}});
$('#tp').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.tp==='close')$('#tp').hidden=true;
else if(d.tp==='min')$('#tp').classList.toggle('min');
else if(d.pre){const keep={};Object.keys(TH).forEach(k=>{if(!COL.includes(k))keep[k]=TH[k]});TH=Object.assign(keep,PRE[d.pre]);everything()}
else if(d.rst){const i=ITEMS.find(x=>x.id===d.rst);if(i.c==='sq'){delete TH.sq;delete TH.v_sqs}else i.c.forEach(c=>delete TH[c[0]]);everything()}
else if('rstall' in d)ask('Voltar todas as cores e o layout para o padrão?',()=>{TH={};everything()},'Sim, restaurar')});
$('#btheme').onclick=()=>{if(!can('A'))return;PS='all';$('#tp').classList.remove('min');panel();$('#tp').hidden=false};
applyTheme();

load();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
</body></html>
